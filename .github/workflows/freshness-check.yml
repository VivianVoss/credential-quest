name: Freshness check

# Checks the official poster + every built exam's live Microsoft Learn pages
# for drift against data.js. Mechanical field changes (level, beta status, a
# weight percentage on an unchanged domain) get auto-patched, merged and
# deployed. Outline changes dated in the future wait until they take effect.
# Anything structural (a domain added/removed, a renamed certification, a
# brand-new poster credential, a page the scraper couldn't parse) gets filed
# as an issue instead — those need real content judgment, not just a data
# patch. Each full run ends with a digest issue assigned to the repo owner.
# See scripts/freshness-check/ for the implementation.

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated exam codes to check (leave blank for all)"
        required: false
        default: ""

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/freshness-check/package-lock.json

      - name: Install poppler-utils (pdftotext, for the poster PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install script dependencies
        working-directory: scripts/freshness-check
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: scripts/freshness-check
        run: npx playwright install --with-deps chromium

      - name: Run freshness check
        working-directory: scripts/freshness-check
        env:
          FRESHNESS_ONLY: ${{ github.event.inputs.only }}
        run: node run.mjs

      - name: Open PR for auto-patched fields
        id: patch_pr
        if: hashFiles('scripts/freshness-check/report/patch-summary.md') != ''
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Freshness check: auto-patch drifted fields"
          title: "Freshness check: auto-patched field(s) from live Microsoft Learn pages"
          body-path: scripts/freshness-check/report/patch-summary.md
          branch: freshness-check/auto-patch
          delete-branch: true
          add-paths: |
            data.js
            scripts/freshness-check/poster-state.json

      # A merge made with GITHUB_TOKEN doesn't fire the deploy workflow's push
      # trigger, so the deploy has to be started explicitly.
      - name: Merge and deploy auto-patched fields
        id: merge
        if: steps.patch_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.patch_pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          gh workflow run azure-static-web-apps-agreeable-meadow-0a6181e03.yml --ref main

      - name: Open issues and post the monthly digest
        if: always()
        working-directory: scripts/freshness-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          FRESHNESS_ONLY: ${{ github.event.inputs.only }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node create-issues.mjs
